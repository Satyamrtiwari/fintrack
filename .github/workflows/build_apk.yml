name: Build FinTrack Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Native Android Scaffolding & Install Dependencies
        run: |
          cd fintrack/frontend
          # Generate official Flutter android scaffolding (gradlew, wrapper, configs)
          flutter create . --platforms=android --org com.fintrack
          flutter pub get

      - name: Add Internet Permission & Cleartext Traffic to AndroidManifest
        run: |
          cd fintrack/frontend
          python3 -c "
          import os, re
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'android.permission.INTERNET' not in content:
                  content = content.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <application')
              if 'usesCleartextTraffic' not in content:
                  content = content.replace('<application', '<application\n        android:usesCleartextTraffic=\"true\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('AndroidManifest updated successfully!')
          "

      - name: Build Android Release APK
        run: |
          cd fintrack/frontend
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-release-apk
          path: fintrack/frontend/build/app/outputs/flutter-apk/app-release.apk
